<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1080, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Amanita Ocean — Instagram Campaign Post</title>
    <link rel="stylesheet" href="post.css">
  </head>
  <body>
    <main class="post" id="post">
      <div class="post__background" aria-hidden="true"></div>
      <div class="post__wash" aria-hidden="true"></div>
      <div class="post__grain" aria-hidden="true"></div>

      <header class="masthead">
        <div class="brand" aria-label="Amanita Ocean">
          <div class="brand__name">
            <span>AMANITA</span>
            <span class="brand__ocean">OCEAN</span>
          </div>
          <p>EVOLVING SPACE REVERB</p>
        </div>
        <p class="masthead__edition">FIVE LIVING CHARACTERS</p>
      </header>

      <section class="campaign-copy" aria-labelledby="headline">
        <h1 id="headline">
          <span>A reverb whose tail</span>
          <em>keeps becoming.</em>
        </h1>
        <p class="campaign-copy__subline">
          FIVE LIVING CHARACTERS <i></i> ONE ENERGY-STABLE 8-LINE FDN
        </p>
      </section>

      <nav class="characters" aria-label="Amanita Ocean reverb characters">
        <span class="characters__default">Default</span>
        <i></i>
        <span class="characters__bloom">Bloom</span>
        <i></i>
        <span class="characters__drift">Drift</span>
        <i></i>
        <span class="characters__veil">Veil</span>
        <i></i>
        <span class="characters__current">Current</span>
      </nav>

      <section class="product" aria-label="Amanita Ocean plug-in interface">
        <div class="product__aura" aria-hidden="true"></div>
        <div class="product__frame">
          <img
            id="pluginRender"
            src="../instagram-stories/plugin-renders/current.png"
            alt="Amanita Ocean plug-in interface showing the Current character"
          >
        </div>
      </section>

      <p class="features">
        EVOLUTION <i></i> HARMONY <i></i> FOCUS <i></i> MONO SAFE <i></i> FREEZE
      </p>

      <footer class="footer">
        <p class="footer__formats">
          <span>macOS</span> VST3 · AU · CLAP
          <i></i>
          <span>WIN / LINUX</span> VST3 · CLAP
        </p>
        <p class="footer__url">ocean.amanita.music</p>
      </footer>

      <div class="safe-area" aria-hidden="true"></div>
    </main>

    <script src="post.js"></script>
  </body>
</html>
